<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img"><title>03 / TILE INTEGRITY &amp; GPU FALLBACK</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8395a7" stroke-width="1.5"/></marker></defs><rect width="1200" height="600" rx="20" fill="#10151c"/><path d="M32 36h36" stroke="#ff4c43" stroke-width="3"/><style>text{font-family:Segoe UI,Arial,sans-serif}</style><text x="84" y="43" font-size="21" fill="#eee9df" font-weight="600">03 / TILE INTEGRITY &amp; GPU FALLBACK</text><text x="32" y="78" font-size="14" fill="#a6b2c1" font-weight="400">Validated work survives interruption · device failure never commits an unchecked result</text><rect x="32" y="140" width="210" height="100" rx="12" fill="#19212b" stroke="#354251"/><text x="50" y="169" font-size="17" fill="#eee9df" font-weight="600">Job preflight</text><text x="50" y="193" font-size="13" fill="#a6b2c1" font-weight="400">Input and dimension checks</text><text x="50" y="214" font-size="13" fill="#a6b2c1" font-weight="400">Disk / memory budget</text><rect x="310" y="140" width="240" height="100" rx="12" fill="#19212b" stroke="#354251"/><text x="328" y="169" font-size="17" fill="#eee9df" font-weight="600">Tile contract</text><text x="328" y="193" font-size="13" fill="#a6b2c1" font-weight="400">Source hash · recipe identity</text><text x="328" y="214" font-size="13" fill="#a6b2c1" font-weight="400">Compatible receipt lookup</text><rect x="620" y="140" width="245" height="100" rx="12" fill="#19212b" stroke="#354251"/><text x="638" y="169" font-size="17" fill="#eee9df" font-weight="600">Compute missing tiles</text><text x="638" y="193" font-size="13" fill="#a6b2c1" font-weight="400">CPU reference path</text><text x="638" y="214" font-size="13" fill="#a6b2c1" font-weight="400">Eligible Local Laplacian work</text><rect x="930" y="140" width="238" height="100" rx="12" fill="#19212b" stroke="#354251"/><text x="948" y="169" font-size="17" fill="#eee9df" font-weight="600">GPU qualification</text><text x="948" y="193" font-size="13" fill="#a6b2c1" font-weight="400">FP64 arithmetic validation</text><text x="948" y="214" font-size="13" fill="#a6b2c1" font-weight="400">Measured workload threshold</text><rect x="930" y="340" width="238" height="100" rx="12" fill="#19212b" stroke="#71cbd0"/><text x="948" y="369" font-size="17" fill="#eee9df" font-weight="600">Fallback</text><text x="948" y="393" font-size="13" fill="#a6b2c1" font-weight="400">Discard failed GPU result</text><text x="948" y="414" font-size="13" fill="#a6b2c1" font-weight="400">Recompute on CPU</text><rect x="620" y="340" width="245" height="100" rx="12" fill="#19212b" stroke="#71cbd0"/><text x="638" y="369" font-size="17" fill="#eee9df" font-weight="600">Validate and save</text><text x="638" y="393" font-size="13" fill="#a6b2c1" font-weight="400">Dimensions · finite values</text><text x="638" y="414" font-size="13" fill="#a6b2c1" font-weight="400">Tile hash and receipt</text><rect x="310" y="340" width="240" height="100" rx="12" fill="#19212b" stroke="#354251"/><text x="328" y="369" font-size="17" fill="#eee9df" font-weight="600">Global accumulation</text><text x="328" y="393" font-size="13" fill="#a6b2c1" font-weight="400">Aligned coordinates</text><text x="328" y="414" font-size="13" fill="#a6b2c1" font-weight="400">Overlap-weighted composition</text><rect x="32" y="340" width="210" height="100" rx="12" fill="#19212b" stroke="#354251"/><text x="50" y="369" font-size="17" fill="#eee9df" font-weight="600">Commit output</text><text x="50" y="393" font-size="13" fill="#a6b2c1" font-weight="400">Stream PNG</text><text x="50" y="414" font-size="13" fill="#a6b2c1" font-weight="400">Atomic metadata</text><polyline points="242,190 310,190" fill="none" stroke="#8395a7" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="550,190 620,190" fill="none" stroke="#8395a7" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="865,190 930,190" fill="none" stroke="#8395a7" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="1049,240 1049,340" fill="none" stroke="#8395a7" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="1060" y="293" font-size="11" fill="#a6b2c1" font-weight="400">Failure / unavailable</text><polyline points="930,390 865,390" fill="none" stroke="#8395a7" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="742,240 742,340" fill="none" stroke="#8395a7" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="754" y="293" font-size="12" fill="#a6b2c1" font-weight="400">CPU / valid GPU</text><polyline points="620,390 550,390" fill="none" stroke="#8395a7" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="310,390 242,390" fill="none" stroke="#8395a7" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="430,240 430,287 580,287 580,324 742,324 742,340" fill="none" stroke="#8395a7" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="335" y="278" font-size="12" fill="#a6b2c1" font-weight="400">Reuse validated tile</text><text x="32" y="514" font-size="12" fill="#71cbd0" font-weight="600">CACHE BOUNDARY</text><text x="32" y="540" font-size="14" fill="#a6b2c1" font-weight="400">Different numerical recipes never share unfinished tile results. Completed exports remain available.</text></svg>