<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img"><title>02 / APPLICATION &amp; EXECUTION</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8395a7" stroke-width="1.5"/></marker></defs><rect width="1200" height="580" rx="20" fill="#10151c"/><path d="M32 36h36" stroke="#ff4c43" stroke-width="3"/><style>text{font-family:Segoe UI,Arial,sans-serif}</style><text x="84" y="43" font-size="21" fill="#eee9df" font-weight="600">02 / APPLICATION &amp; EXECUTION</text><text x="32" y="78" font-size="14" fill="#a6b2c1" font-weight="400">One numerical implementation · native desktop and command-line entry points</text><rect x="32" y="130" width="210" height="90" rx="12" fill="#19212b" stroke="#354251"/><text x="50" y="159" font-size="17" fill="#eee9df" font-weight="600">Desktop</text><text x="50" y="183" font-size="13" fill="#a6b2c1" font-weight="400">Native wxWidgets</text><text x="50" y="204" font-size="13" fill="#a6b2c1" font-weight="400">Selection · compare · export</text><rect x="32" y="270" width="210" height="90" rx="12" fill="#19212b" stroke="#354251"/><text x="50" y="299" font-size="17" fill="#eee9df" font-weight="600">Console</text><text x="50" y="323" font-size="13" fill="#a6b2c1" font-weight="400">JSON progress records</text><text x="50" y="344" font-size="13" fill="#a6b2c1" font-weight="400">Files · folders · exact scale</text><rect x="310" y="200" width="240" height="110" rx="12" fill="#19212b" stroke="#71cbd0"/><text x="328" y="229" font-size="17" fill="#eee9df" font-weight="600">Supervisor</text><text x="328" y="253" font-size="13" fill="#a6b2c1" font-weight="400">Persistent job workspace</text><text x="328" y="274" font-size="13" fill="#a6b2c1" font-weight="400">Worker process containment</text><text x="328" y="295" font-size="13" fill="#a6b2c1" font-weight="400">Queue · pause · resume</text><rect x="625" y="200" width="240" height="110" rx="12" fill="#19212b" stroke="#71cbd0"/><text x="643" y="229" font-size="17" fill="#eee9df" font-weight="600">Worker process</text><text x="643" y="253" font-size="13" fill="#a6b2c1" font-weight="400">Shared Python engine</text><text x="643" y="274" font-size="13" fill="#a6b2c1" font-weight="400">Memory-aware tile scheduling</text><text x="643" y="295" font-size="13" fill="#a6b2c1" font-weight="400">Per-stage measurements</text><rect x="935" y="130" width="232" height="90" rx="12" fill="#19212b" stroke="#354251"/><text x="953" y="159" font-size="17" fill="#eee9df" font-weight="600">CPU</text><text x="953" y="183" font-size="13" fill="#a6b2c1" font-weight="400">NumPy processing</text><text x="953" y="204" font-size="13" fill="#a6b2c1" font-weight="400">Up to six tile workers</text><rect x="935" y="270" width="232" height="90" rx="12" fill="#19212b" stroke="#354251"/><text x="953" y="299" font-size="17" fill="#eee9df" font-weight="600">Optional GPU</text><text x="953" y="323" font-size="13" fill="#a6b2c1" font-weight="400">OpenCL FP64 helper</text><text x="953" y="344" font-size="13" fill="#a6b2c1" font-weight="400">Local Laplacian only</text><rect x="625" y="415" width="542" height="88" rx="12" fill="#19212b" stroke="#354251"/><text x="643" y="444" font-size="17" fill="#eee9df" font-weight="600">Durable output</text><text x="643" y="468" font-size="13" fill="#a6b2c1" font-weight="400">Validated tile receipts → streamed PNG → completion metadata</text><polyline points="242,175 275,175 275,255 310,255" fill="none" stroke="#8395a7" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="242,315 275,315 275,255 310,255" fill="none" stroke="#8395a7" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="550,255 625,255" fill="none" stroke="#8395a7" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="865,255 900,255 900,175 935,175" fill="none" stroke="#8395a7" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="865,255 900,255 900,315 935,315" 